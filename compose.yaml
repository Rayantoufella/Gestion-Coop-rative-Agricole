name: gca

# Lancement complet : docker compose up --build
# - frontend React (Vite)  : http://localhost:5174  (GCA_FRONTEND_PORT)
# - API Laravel            : http://localhost:8001  (GCA_API_PORT)
# - MySQL                  : non exposé sur la machine, seulement entre conteneurs
# Les ports se changent dans un fichier .env à la racine (voir .env.example).

services:
  mysql:
    image: mysql:8.4
    environment:
      # Valeurs de démonstration, identiques à backend/.env.example.
      MYSQL_DATABASE: gca
      MYSQL_USER: gca_user
      MYSQL_PASSWORD: gca_2026
      MYSQL_ROOT_PASSWORD: gca_root_demo
    volumes:
      - db_data:/var/lib/mysql
      # Crée aussi la base "testing" utilisée par PHPUnit.
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Passe au vert seulement quand MySQL accepte les connexions de l'application.
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -u gca_user -pgca_2026 -e 'SELECT 1' gca"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    ports:
      - "${GCA_API_PORT:-8001}:8000"
    environment:
      APP_URL: http://localhost:${GCA_API_PORT:-8001}
      CORS_ALLOWED_ORIGINS: http://localhost:${GCA_FRONTEND_PORT:-5174}
      PHP_CLI_SERVER_WORKERS: 4
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      # /up est la route de santé de Laravel.
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/up') === false ? 1 : 0);"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  frontend:
    build:
      context: .
      dockerfile: docker/node/Dockerfile
    ports:
      - "${GCA_FRONTEND_PORT:-5174}:5173"
    environment:
      # Adresse de l'API vue depuis le navigateur.
      VITE_API_URL: http://localhost:${GCA_API_PORT:-8001}/api
    volumes:
      - ./frontend:/app
      - node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db_data:
  node_modules:
